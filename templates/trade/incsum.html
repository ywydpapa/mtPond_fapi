<!DOCTYPE html>
<html lang="en">
<head>
        {% include '/comm/adheader.html' %}
        <style>
            .badge-daily {
                background-color: #e2e8f0;
                color: #475569;
                font-size: 0.75rem;
                padding: 2px 6px;
                border-radius: 4px;
                margin-left: 4px;
            }
        </style>
</head>
<body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">
        {% include '/comm/sidebar.html' %}
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <!-- Main Content -->
            <div id="content">
                {% include '/comm/adtopbar.html' %}
                <!-- Begin Page Content -->
                <div class="container-fluid">
                <div class="row">
                <div class="col-lg-6">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">나의 수익 현황</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr style="text-align: center">
                                            <th>집계 일자</th>
                                            <th>잔고</th>
                                            <th>차액</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBody">
                                        <!-- 자바스크립트로 오늘/어제 상세 및 과거 일별 요약 행 렌더링 -->
                                    </tbody>
                                    <tfoot>
                                        <tr>
                                            <td colspan="2" style="text-align: center; background-color: linen; font-weight: bold;"> 차액 합계</td>
                                            <td id="suminc" style="text-align: right; background-color: linen; font-weight: bold;"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">수익현황</h6>
                        </div>
                        <div class="card-body">
                            <div class="chart-area" style="position: relative; height: 320px;">
                                <canvas id="myChart1"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End of Main Content -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; SOFTCORE 2025</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    {% include '/comm/adscript.html' %}
    {% include '/comm/adscriptchart.html' %}
<script>
    // 서버에서 전달받은 원본 데이터
    var dataArr1 = {{ tval | safe }};
    var dataArr2 = {{ ival | safe }};
    var rawItems = {{ items | tojson | safe }};

    $(document).ready(function () {
        buildTable();
        renderChart();
    });

    function numberWithCommas(x) {
        if (x === null || x === undefined) return "0";
        return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function getDateString(d) {
        var year = d.getFullYear();
        var month = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        return year + '-' + month + '-' + day;
    }

    function buildTable() {
        if (!rawItems || rawItems.length === 0) return;

        var today = new Date();
        var yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        var limitDate = new Date();
        limitDate.setDate(today.getDate() - 30);

        var todayStr = getDateString(today);
        var yestStr = getDateString(yesterday);
        var limitDateStr = getDateString(limitDate);

        var processedList = [];
        var pastDailyMap = {};

        rawItems.forEach(function (item) {
            var timeStr = item[1].toString();
            var datePart = timeStr.substring(0, 10);
            var balance = parseInt(item[2]) || 0;

            if (datePart < limitDateStr) {
                return;
            }

            if (datePart === todayStr || datePart === yestStr) {
                processedList.push({
                    displayTime: timeStr,
                    balance: balance,
                    isDailySummary: false
                });
            } else {
                pastDailyMap[datePart] = {
                    displayTime: datePart,
                    balance: balance,
                    isDailySummary: true
                };
            }
        });

        var pastDays = Object.keys(pastDailyMap).sort();
        pastDays.forEach(function (d) {
            processedList.push(pastDailyMap[d]);
        });

        // 테이블은 시간순(과거 -> 최신) 정렬
        processedList.sort(function(a, b) {
            return a.displayTime.localeCompare(b.displayTime);
        });

        var tbodyHtml = "";
        var suminc = 0;

        for (var i = 0; i < processedList.length; i++) {
            var cur = processedList[i].balance;
            var prev = (i === 0) ? cur : processedList[i - 1].balance;
            var diff = cur - prev;
            suminc += diff;

            var diffText = "0";
            if (diff > 0) {
                diffText = "<span style='color:red;'>+" + numberWithCommas(diff) + "</span>";
            } else if (diff < 0) {
                diffText = "<span style='color:blue;'>" + numberWithCommas(diff) + "</span>";
            }

            var badge = processedList[i].isDailySummary ? "<span class='badge-daily'>일별마감</span>" : "";

            tbodyHtml += "<tr style='text-align: right;'>";
            tbodyHtml += "  <td style='text-align: center;'>" + processedList[i].displayTime + " " + badge + "</td>";
            tbodyHtml += "  <td>" + numberWithCommas(cur) + "</td>";
            tbodyHtml += "  <td>" + diffText + "</td>";
            tbodyHtml += "</tr>";
        }

        $("#tableBody").html(tbodyHtml);
        $("#suminc").html(numberWithCommas(suminc));
    }

    function renderChart() {
        if (!dataArr1 || dataArr1.length === 0) return;

        var chartLabels = dataArr1.slice();
        var chartData = dataArr2.slice();

        // 첫 번째 데이터가 마지막 데이터보다 미래(최신)인 경우, 최신이 오른쪽으로 가도록 역순 뒤집기
        if (chartLabels.length >= 2 && chartLabels[0] > chartLabels[chartLabels.length - 1]) {
            chartLabels.reverse();
            chartData.reverse();
        }

        new Chart(document.getElementById("myChart1"), {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: '총 자산 잔고 (KRW)',
                    data: chartData,
                    borderColor: "rgb(247,85,16)",
                    backgroundColor: "rgba(247,85,16,0.05)",
                    fill: true,
                    lineTension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                title: { display: true, text: "자산 변동 추이 (과거 → 최신)" },
                tooltips: {
                    mode: 'index',
                    intersect: false,
                    callbacks: {
                        label: function(tooltipItem) {
                            return numberWithCommas(tooltipItem.yLabel) + " 원";
                        }
                    }
                },
                scales: {
                    xAxes: [{
                        display: true,
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 8
                        }
                    }],
                    yAxes: [{
                        display: true,
                        ticks: {
                            callback: function(value) {
                                return numberWithCommas(value) + "원";
                            }
                        }
                    }]
                }
            }
        });
    }
</script>
</body>
</html>
